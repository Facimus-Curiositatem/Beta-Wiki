<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secciones - Beta Wiki</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <h1>Secciones de la Wiki</h1>

        <p th:if="${#lists.isEmpty(paginas)}" class="empty-state">
            Todavia no hay secciones registradas.
        </p>

        <div class="buscador" th:unless="${#lists.isEmpty(paginas)}">
            <label for="buscar-seccion">Buscar en la wiki</label>
            <input type="search" id="buscar-seccion" placeholder="Ej: JWT, ADR-004, pool, HU-19..." autocomplete="off">
            <p id="resultado-busqueda" class="resultado-busqueda" aria-live="polite"></p>
        </div>

        <section th:unless="${#lists.isEmpty(paginas)}" th:each="categoria : ${categorias}" class="section seccion-categoria">
            <h2 th:text="${categoria}" style="margin-top: 2rem;">Categoria</h2>
            <div class="card-grid">
                <article class="card" th:each="pagina : ${paginas}" th:if="${pagina.categoria == categoria}"
                         th:attr="data-buscar=${pagina.titulo + ' ' + pagina.categoria + ' ' + pagina.contenido + ' ' + (pagina.markdown ?: '')}">
                    <span class="categoria" th:text="${pagina.categoria}">Categoria</span>
                    <h3 th:text="${pagina.titulo}">Titulo</h3>
                    <p th:text="${pagina.contenido}">Contenido</p>
                    <a th:href="@{/secciones/{slug}(slug=${pagina.slug})}">Leer mas</a>
                </article>
            </div>
        </section>

        <p id="sin-resultados" class="empty-state" hidden>No hay secciones que coincidan con la busqueda.</p>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>

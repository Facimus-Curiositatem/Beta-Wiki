<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactenos - Beta Wiki</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="contenido">
        <h1>Contactenos</h1>
        <p>Tienes preguntas o sugerencias? Envianos un mensaje.</p>

        <!-- novalidate: la validacion la exige el taller en JS, no la nativa del navegador -->
        <form id="form-contacto" class="form-contacto" method="post" th:action="@{/contactenos}" novalidate>

            <div class="form-group">
                <label for="nombre">Nombre completo *</label>
                <input type="text" id="nombre" name="nombre" minlength="3" required autocomplete="name">
                <small class="error" data-error-for="nombre"></small>
            </div>

            <div class="form-group">
                <label for="email">Correo electronico *</label>
                <input type="email" id="email" name="email" required autocomplete="email">
                <small class="error" data-error-for="email"></small>
            </div>

            <div class="form-group">
                <label for="telefono">Telefono *</label>
                <input type="tel" id="telefono" name="telefono"
                       inputmode="numeric" minlength="7" maxlength="15" required>
                <small class="error" data-error-for="telefono"></small>
            </div>

            <div class="form-group">
                <label for="asunto">Asunto o motivo *</label>
                <select id="asunto" name="asunto" required>
                    <option value="" disabled selected>Seleccione una opcion</option>
                    <option value="soporte">Soporte tecnico</option>
                    <option value="informacion">Solicitud de informacion</option>
                    <option value="sugerencia">Sugerencia</option>
                    <option value="otro">Otro</option>
                </select>
                <small class="error" data-error-for="asunto"></small>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje *</label>
                <textarea id="mensaje" name="mensaje" minlength="20" maxlength="400" rows="6" required></textarea>
                <small id="contador-mensaje" class="contador">Faltan 20 caracteres</small>
                <small class="error" data-error-for="mensaje"></small>
            </div>

            <!-- Zona de feedback: la validacion JS escribe aqui el resultado global -->
            <div id="form-feedback" class="feedback" role="alert" aria-live="polite" hidden></div>

            <button type="submit" class="btn-enviar">Enviar mensaje</button>
        </form>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>

spring.application.name=Beta Wiki
server.port=8080
spring.thymeleaf.cache=false
# Detras de Tailscale Funnel la app recibe HTTP plano: con redirecciones relativas el navegador conserva https y el puerto
server.tomcat.use-relative-redirects=true
# La sesion viaja solo en la cookie, nunca como ;jsessionid en la URL
server.servlet.session.tracking-modes=cookie
